# ==========================================================================
#  The Sift - configuration
#  World-generation values are read ONCE when the world is first created/loaded.
#  Changing them later only affects chunks that have not been generated yet,
#  and requires a restart. Everything else can be changed with /sift reload.
# ==========================================================================

world:
  name: world_the_sift
  # NORMAL = day/night cycle, regular sky.  THE_END = purple void sky (beds explode there).
  environment: NORMAL
  generation:
    island-threshold: 0.12      # higher = fewer / smaller floating islands (-1..1 noise cut-off)
    height-variance: 18         # max +/- blocks the island tops drift from y=64
    chasm-width: 0.07           # higher = wider chasms cutting the islands
    pool-threshold: 0.55        # higher = rarer Ichor pools (water pockets)
    spawn-platform-radius: 24   # guaranteed flat island around 0,0
    trees-per-chunk: 2          # pale-oak tree attempts per chunk (clearings only)
    chest-chance: 0.04          # chance per chunk of a loot chest on an island

portal:
  frame-material: REINFORCED_DEEPSLATE
  horn-search-radius: 10        # blocks around the player searched for a frame
  note-search-radius: 8         # note blocks must be within this many blocks of the frame
  note-window-seconds: 12       # notes played within this window before the horn count
  minimum-notes: 3              # distinct note blocks required
  require-harmony: true         # notes must contain a major or minor triad
  horn-cooldown-ticks: 40
  teleport-cooldown-seconds: 5
  teleport-mobs: false          # if true, living non-player entities also use portals
  sift-scale: 1.0               # sift coordinates = overworld coordinates / sift-scale
  overworld-name: ""            # leave empty to use the first NORMAL world

rifts:
  duration-seconds: 300         # 5 minutes
  teleport-cooldown-seconds: 3
  announce: true                # tell nearby players when a rift opens
  max-active: 6
  natural-spawning:
    enabled: true
    check-interval-seconds: 120 # how often a spawn roll happens
    chance: 0.35                # probability of a rift per roll
    min-distance: 24
    max-distance: 80

ichor:
  enabled: true
  # Any of these block types inside The Sift counts as Ichor (water pockets are generated by the world generator).
  materials: [WATER]
  tick-interval: 10             # ticks between checks
  damage: 2.0                   # health points per check when unprotected
  damage-type: MAGIC            # MAGIC or WITHER
  apply-wither-effect: false
  regeneration-duration-ticks: 60   # Soul Absorption II -> Regeneration II
  bottled:
    damage: 8.0
    wither-seconds: 6
    heal: 8.0
    soul-absorption-1-negates: true

siftite:
  armor-toughness: 1.0
  knockback-resistance: 0.05
  attack-damage: 1.0
  attack-speed: 0.2
  extra-durability: 250

soul-absorption:
  anvil-cost-1: 10
  anvil-cost-2: 20

charoite:
  extra-level-cost: 5           # extra XP levels charged on top of the table cost
  max-over-cap: 1               # how far above the vanilla max level an enchant may go

recovery:
  enabled: true
  delay-ticks: 60               # 3 seconds
  mini-rift-ticks: 100

mobs:
  enabled: true                 # light custom spawner for The Sift
  interval-ticks: 100
  cap-per-player: 6
  types: [ENDERMAN, SKELETON, ZOMBIE, SPIDER]

loot:
  mob-drop:
    siftite-ingot: 0.06
    charoite: 0.10
    siftite-template: 0.008
  chest:
    siftite-ingot: 0.35
    charoite: 0.50
    siftite-template: 0.15
    soul-tome: 0.12
